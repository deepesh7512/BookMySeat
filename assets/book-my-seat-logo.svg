<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Book My Seat</title>
  <desc id="desc">Navy B monogram with a golden route and destination marker.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b3150"/><stop offset="1" stop-color="#0b1729"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1d48c"/><stop offset="1" stop-color="#bd8a38"/></linearGradient>
  </defs>
  <style>
    .route-mover{animation:route-travel 3.6s linear infinite}
    .destination-pulse{transform-box:fill-box;transform-origin:center;animation:destination-pulse 2.5s ease-out infinite}
    @keyframes route-travel{to{stroke-dashoffset:-100}}
    @keyframes destination-pulse{0%{opacity:.75;transform:scale(.72)}100%{opacity:0;transform:scale(1.65)}}
    @media (prefers-reduced-motion:reduce){.route-mover,.destination-pulse{animation:none;display:none}}
  </style>
  <g transform="translate(8 8) scale(.47)">
    <rect x="12" y="12" width="488" height="488" rx="132" fill="url(#navy)"/>
    <circle cx="256" cy="256" r="207" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="2"/>
    <path d="M83 354C96 242 144 153 232 112c62-29 126-23 184 13" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
    <path class="route-mover" pathLength="100" d="M83 354C96 242 144 153 232 112c62-29 126-23 184 13" fill="none" stroke="#fff4d2" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 90"/>
    <circle class="destination-pulse" cx="416" cy="130" r="23" fill="none" stroke="#f1d48c" stroke-width="6"/>
    <circle cx="416" cy="130" r="13" fill="url(#gold)" stroke="#fff5dc" stroke-width="6"/>
    <path fill="#f7f4ec" fill-rule="evenodd" d="M166 150h106c68 0 106 34 106 89 0 34-16 59-45 73 34 14 55 40 55 75 0 52-41 78-112 78H166V150zm64 53v77h39c29 0 45-14 45-39 0-24-16-38-45-38h-39zm0 133v75h46c32 0 47-12 47-35 0-24-15-40-47-40h-46z"/>
  </g>
  <text x="275" y="108" fill="#14243d" font-family="Inter, Montserrat, Arial, sans-serif" font-size="69" font-weight="800" letter-spacing="-1.3">BOOK MY SEAT</text>
  <text x="279" y="157" fill="#66758a" font-family="Inter, Montserrat, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="4.3">YOUR JOURNEY, YOUR SEAT</text>
  <path d="M279 180h186" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
</svg>
