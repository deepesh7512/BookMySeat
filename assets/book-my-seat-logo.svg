<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 220" role="img" aria-labelledby="title desc">
  <title id="title">Book My Seat</title>
  <desc id="desc">Book My Seat travel booking brand logo.</desc>
